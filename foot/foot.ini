# foot.ini - port of ghostty/config.ghostty
# https://codeberg.org/dnkl/foot

[main]
font=JetBrainsMono Nerd Font:weight=semibold:fontfeatures=-calt:size=16
# ghostty: font-style = semiBold / font-feature = -calt
# font-features are passed through fontconfig; if -calt is ignored, remove it.
# ghostty: confirm-close-surface = false  -> foot always closes immediately
# ghostty: window-vsync = true            -> Wayland is always vsync'd
# ghostty: window-save-state = always     -> no session restore in foot
# ghostty: window-inherit-working-directory = false
#          only affects spawn-terminal/OSC 7; foot has no toggle
initial-window-mode=windowed

[csd]
# ghostty: gtk-titlebar = false (use server-side decorations)
preferred=server

[cursor]
# ghostty: cursor-style = block / cursor-style-blink = true
# style=block
style=beam
blink=yes

[colors-dark]
# ghostty: theme = Gruvbox Dark
background=282828
foreground=ebdbb2
cursor=282828 ebdbb2
selection-foreground=ebdbb2
selection-background=665c54

regular0=282828
regular1=cc241d
regular2=98971a
regular3=d79921
regular4=458588
regular5=b16286
regular6=689d6a
regular7=a89984

bright0=928374
bright1=fb4934
bright2=b8bb26
bright3=fabd2f
bright4=83a598
bright5=d3869b
bright6=8ec07c
bright7=ebdbb2

# ghostty: background-opacity = 0.8
alpha=0.8

[key-bindings]
# ghostty: ctrl+backspace = text:\x17
# foot cannot inject arbitrary text; send ^W from the shell instead.
#
# ghostty vim key-table (alt+v) has no equivalent in foot:
# foot has no key tables, split actions or text actions.
# Enabled scrollback bindings below approximate vim scrolling without a mode.
# You can also use the built-in search (ctrl+shift+r) and URL modes.
scrollback-up-line=Alt+k
scrollback-down-line=Alt+j
scrollback-up-half-page=Alt+u
scrollback-down-half-page=Alt+d
scrollback-home=Alt+g
scrollback-end=Alt+Shift+g
\x17=Control+BackSpace
