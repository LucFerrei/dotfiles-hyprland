# path   — raiz a varrer (aceita ~ e $HOME)
# depth  — profundidade da varredura (default 1)
# hidden — inclui dotdirs (default false)
# ignore — nomes podados antes de descer

[[paths]]
path = "~"
ignore = ["Desktop", "Public", "Templates", "Music", "Pictures", "Videos"]

[[paths]]
path = "~/personal"

[[paths]]
path = "~/work"

[[paths]]
path = "~/learning_rust"
ignore = ["target"]

# descidas pontuais: depth = 2 no learning_rust inteiro traria os ~40 capítulos
# de arquitetura_software junto
[[paths]]
path = "~/learning_rust/first_tokio_projects"
ignore = ["target"]

[[paths]]
path = "~/learning_rust/claude_test"
ignore = ["target"]
