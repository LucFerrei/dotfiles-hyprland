# Vesper theme for kitty
# Portado da paleta do vespera.nvim (https://github.com/LucFerrei/vespera.nvim)
# Paleta original: /usr/share/ghostty/themes/Vesper

# ── Cores básicas ──────────────────────────────────────────────
background            #101010
foreground             #ffffff

cursor                 #acb1ab
cursor_text_color      #101010

selection_background   #988049
selection_foreground   #b9beb8

# ── Bordas de janela ────────────────────────────────────────────
active_border_color    #ffc799
inactive_border_color  #7e7e7e

# ── Abas ────────────────────────────────────────────────────────
active_tab_background   #101010
active_tab_foreground   #ffc799
inactive_tab_background #101010
inactive_tab_foreground #7e7e7e

# ── URL underline ───────────────────────────────────────────────
url_color               #99ffe4

# ── Paleta ANSI de 16 cores ─────────────────────────────────────
# black
color0  #101010
color8  #7e7e7e

# red
color1  #f5a191
color9  #ff8080

# green
color2  #90b99f
color10 #99ffe4

# yellow / peach - orange
color3  #e6b99d
color11 #ffc799

# blue / purple
color4  #aca1cf
color12 #b9aeda

# magenta / pink
color5  #e29eca
color13 #ecaad6

# cyan / rose
color6  #ea83a5
color14 #f591b2

# white
color7  #a0a0a0
color15 #ffffff

# ── Cores extras (diffs, terminal.app-like markers) ─────────────
