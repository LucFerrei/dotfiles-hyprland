#just testing
hide_window_decorations yes

tab_bar_style powerline

font_size 13
# font_size 15

# font_family JetBrainsMono Nerd Font
# font_family VictorMono Nerd Font
font_family JetBrainsMono Nerd Font
# font_family IosevkaTermSlab Nerd Font
# font_family ZedMono Nerd Font
# font_family CaskaydiaCove Nerd Font
include lLaslk

# BEGIN_KITTY_THEME
# Rosé Pine
# include current-theme.conf
# include kanagawa_dragon.conf
# include rose-pine-moon.conf
# include vespera.conf
# include Tokyo Night Moon.conf
include Carbonfox.conf
# include Tokyo Night.conf
# END_KITTY_THEME
#

start_in_fullscreen yes   

disable_ligatures always

background_opacity 1
#
enable_audio_bell no

enable_background_blur no
background_blur 0
# background_blur 0

confirm_os_window_close 0
# Use nvim (or vim) to view the scrollback buffer
# scrollback_pager nvim -c "set signcolumn=no showtabline=0" -c "silent write! /tmp/kitty_scrollback_buffer | te cat /tmp/kitty_scrollback_buffer - "
#
close_on_child_death no

# cursor_trail 1
# cursor_trail_decay 0.1 0.4
cursor_shape     beam
# Options: block, beam, underline

cursor_beam_thickness 1.5
cursor_underline_thickness 2.0
shell_integration no-cursor
